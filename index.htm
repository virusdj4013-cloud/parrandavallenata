<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parranda Vallenata Web</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-orange: #ff6b00;
            --default-bg: url('https://blogger.googleusercontent.com/img/a/AVvXsEjLLyZ708LW-OuIZB6E1XtTjXRmTjNYhyFwDwetpY5i8QvtiJMFReZ2PvJzAwUPFcfonQNr3R2p00eWfDrgLcwSoSLeDkLelQlOwV7yPcQbxrNPOQG0Osr8l9ya3urHEcy6M6RtQgun7TzY1qwL5dir8mTMqxVyXw2E7LtcZscjrY1yDdxsWShSaVAfEYQ=s1350');
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; color: white;
            font-family: 'Inter', sans-serif; overflow: hidden;
        }

        #bgBlur {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; background-size: cover; background-position: center;
            background-image: var(--default-bg);
            filter: blur(40px) brightness(0.6); /* Desenfoque más profundo para estilo moderno */
            transition: background-image 1.2s ease-in-out;
            transform: scale(1.1);
        }

        .gradient-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            background: radial-gradient(circle at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.8) 100%);
        }

        .main-view {
            position: relative; z-index: 5;
            height: 100vh; width: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 15px; box-sizing: border-box;
        }

        .art-box-fixed {
            width: 80vw; height: 80vw;
            max-width: 400px; max-height: 400px;
            margin-bottom: 30px;
            border-radius: 24px; overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            background-image: var(--default-bg);
            background-size: cover; background-position: center;
            /* Transición suave para cuando cambia la carátula */
            transition: transform 0.1s ease-out, background-image 0.8s ease-in-out; 
        }

        .metadata-bar {
            width: 100%; max-width: 450px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            padding: 16px 24px; border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; gap: 15px;
        }

        .info { flex: 1; min-width: 0; }

        .live-status {
            color: var(--primary-orange); font-size: 9px;
            font-weight: 900; letter-spacing: 1.5px;
            text-transform: uppercase; margin-bottom: 4px;
            display: flex; align-items: center; gap: 6px;
        }

        .dot { width: 8px; height: 8px; background: var(--primary-orange); border-radius: 50%; animation: pulse-dot 1.5s infinite; }

        .scroll-wrapper { overflow: hidden; white-space: nowrap; width: 100%; }
        .scroll-content { display: inline-block; }
        .is-scrolling { animation: marquee 10s linear infinite; padding-left: 100%; }

        #songTitle { font-size: 1.2rem; font-weight: 800; margin: 0; color: #fff; }
        #songArtist { font-size: 0.95rem; opacity: 0.7; margin: 2px 0 0; }

        .play-btn {
            background: #fff; border: none;
            width: 55px; height: 55px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s ease; flex-shrink: 0;
        }
        .play-btn svg { width: 24px; fill: #000; }
        .play-btn:active { transform: scale(0.9); }

        footer { position: fixed; bottom: 20px; width: 100%; text-align: center; z-index: 10; }
        .copyright { font-size: 10px; color: rgba(255, 255, 255, 0.4); font-weight: 700; }

        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        @keyframes pulse-dot { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.4; } 100% { transform: scale(1); opacity: 1; } }

        @media (max-height: 650px) {
            .art-box-fixed { width: 65vw; height: 65vw; margin-bottom: 20px; }
        }
    </style>
</head>
<body>

    <div id="bgBlur"></div>
    <div class="gradient-overlay"></div>

    <div class="main-view">
        <div class="art-box-fixed" id="artVisual"></div>

        <div class="metadata-bar">
            <div class="info">
                <div class="live-status"><span class="dot"></span> En Vivo</div>
                
                <div class="scroll-wrapper" id="titleWrapper">
                    <div class="scroll-content" id="titleContent">
                        <h2 id="songTitle">Sintonizando...</h2>
                    </div>
                </div>

                <div class="scroll-wrapper" id="artistWrapper">
                    <div class="scroll-content" id="artistContent">
                        <p id="songArtist">Parranda Vallenata</p>
                    </div>
                </div>
            </div>
            
            <button class="play-btn" id="playToggle">
                <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
        </div>
    </div>

    <footer>
        <div class="copyright">© 2026 AC MEDIA</div>
    </footer>

    <audio id="radioStream" crossorigin="anonymous"></audio>

    <script>
        const STREAM_URL = 'https://a7.asurahosting.com:6640/radio.mp3';
        const API_AZURA = 'https://a7.asurahosting.com/api/nowplaying_static/parranda_vallenata_web_.json';
        const DEFAULT_BG = 'https://blogger.googleusercontent.com/img/a/AVvXsEjLLyZ708LW-OuIZB6E1XtTjXRmTjNYhyFwDwetpY5i8QvtiJMFReZ2PvJzAwUPFcfonQNr3R2p00eWfDrgLcwSoSLeDkLelQlOwV7yPcQbxrNPOQG0Osr8l9ya3urHEcy6M6RtQgun7TzY1qwL5dir8mTMqxVyXw2E7LtcZscjrY1yDdxsWShSaVAfEYQ=s1350';
        
        const audio = document.getElementById('radioStream');
        const playBtn = document.getElementById('playToggle');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const bgBlur = document.getElementById('bgBlur');
        const artVisual = document.getElementById('artVisual');

        let currentTrackId = "";

        // Función para verificar si el texto debe hacer scroll
        function checkScroll() {
            const elements = [
                { wrapper: 'titleWrapper', content: 'titleContent' },
                { wrapper: 'artistWrapper', content: 'artistContent' }
            ];
            elements.forEach(el => {
                const wrap = document.getElementById(el.wrapper);
                const cont = document.getElementById(el.content);
                if (cont.scrollWidth > wrap.offsetWidth) {
                    cont.classList.add('is-scrolling');
                } else {
                    cont.classList.remove('is-scrolling');
                }
            });
        }

        async function getiTunesArt(term) {
            try {
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&media=music&limit=1`);
                const data = await response.json();
                if (data.results && data.results.length > 0) {
                    return data.results[0].artworkUrl100.replace('100x100bb', '1000x1000bb');
                }
            } catch (e) {}
            return null;
        }

        async function fetchMetadata() {
            try {
                const response = await fetch(API_AZURA);
                const data = await response.json();
                const np = Array.isArray(data) ? data[0].now_playing : data.now_playing;
                
                const trackKey = np.song.title + np.song.artist;
                if (currentTrackId !== trackKey) {
                    currentTrackId = trackKey;
                    document.getElementById('songTitle').textContent = np.song.title;
                    document.getElementById('songArtist').textContent = np.song.artist;

                    const art = await getiTunesArt(`${np.song.artist} ${np.song.title}`);
                    const finalArt = art || DEFAULT_BG;
                    
                    bgBlur.style.backgroundImage = `url('${finalArt}')`;
                    artVisual.style.backgroundImage = `url('${finalArt}')`;
                    
                    setTimeout(checkScroll, 500);
                }
            } catch (error) {}
        }

        // --- Lógica del Reproductor ---
        playBtn.addEventListener('click', () => {
            initVisualizer();
            if (audio.paused) {
                // Forzamos carga del stream con timestamp para evitar caché y delay
                audio.src = STREAM_URL + "?t=" + Date.now();
                audio.play();
                playIcon.style.display = 'none'; pauseIcon.style.display = 'block';
            } else {
                audio.pause();
                audio.src = ""; // Liberamos el buffer
                playIcon.style.display = 'block'; pauseIcon.style.display = 'none';
                artVisual.style.transform = `scale(1)`;
            }
        });

        // --- Visualizador de Audio (Efecto Pulso) ---
        let audioCtx, analyser, dataArray;
        function initVisualizer() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                const source = audioCtx.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 64;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                renderFrame();
            }
        }

        function renderFrame() {
            requestAnimationFrame(renderFrame);
            if (!audio.paused) {
                analyser.getByteFrequencyData(dataArray);
                let volume = 0;
                for(let i=0; i<dataArray.length; i++) volume += dataArray[i];
                volume = volume / dataArray.length;
                
                let scale = 1 + (volume / 255) * 0.15; 
                artVisual.style.transform = `scale(${scale})`;
            }
        }

        window.addEventListener('resize', checkScroll);
        setInterval(fetchMetadata, 10000);
        fetchMetadata();
    </script>
</body>
</html>
